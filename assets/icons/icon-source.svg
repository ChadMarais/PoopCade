<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Poopcade app icon</title>
  <desc id="desc">A geometric neon letter P crossed by an orbital arc on a dark arcade background.</desc>
  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="438" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12132a"/>
      <stop offset="0.5" stop-color="#080810"/>
      <stop offset="1" stop-color="#100b1e"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(256 253) rotate(90) scale(246)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#342267" stop-opacity="0.58"/>
      <stop offset="0.58" stop-color="#11111d" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#080810" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="178" y1="144" x2="349" y2="361" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6cf7ff"/>
      <stop offset="0.48" stop-color="#41dfff"/>
      <stop offset="1" stop-color="#a774ff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="133" y1="287" x2="391" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a774ff"/>
      <stop offset="0.52" stop-color="#765cff"/>
      <stop offset="1" stop-color="#48eaff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.032" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tight-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background supports Android maskable icon cropping. -->
  <rect width="512" height="512" fill="url(#background)"/>
  <rect width="512" height="512" fill="url(#aura)"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <circle cx="256" cy="256" r="221" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="2"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#4de7ff" stroke-opacity="0.055" stroke-width="1"/>

  <!-- The essential mark stays within a 328px-diameter central safe circle. -->
  <g>
    <path d="M192 360V165C192 153 201 144 213 144H268C315 144 347 173 347 216C347 261 313 289 263 289H223"
      fill="none" stroke="#4de7ff" stroke-opacity="0.22" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)"/>
    <path d="M192 360V165C192 153 201 144 213 144H268C315 144 347 173 347 216C347 261 313 289 263 289H223"
      fill="none" stroke="url(#neon)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M199 163H265C301 163 325 183 325 216C325 249 301 269 263 269H222"
      fill="none" stroke="#effeff" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>

    <path d="M135 295C161 354 229 382 294 368C346 357 382 322 391 277"
      fill="none" stroke="#8c65ff" stroke-opacity="0.24" stroke-width="28" stroke-linecap="round" filter="url(#soft-glow)"/>
    <path d="M135 295C161 354 229 382 294 368C346 357 382 322 391 277"
      fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round"/>
    <circle cx="391" cy="277" r="13" fill="#e8fdff" stroke="#4de7ff" stroke-width="5" filter="url(#tight-glow)"/>
    <circle cx="135" cy="295" r="6" fill="#b58aff"/>
  </g>
</svg>
